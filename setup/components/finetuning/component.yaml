$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: aurora_finetuning  # if changing, sync 0_aurora_workshop.ipynb
display_name: Aurora Finetuning
version: 1
description: Command component for performing fine-tuning of Microsoft Aurora.
tags:
  project: aurora-introductory-workshop

code: .
environment: azureml:aurora_environment@latest
# config arg wrapped in single quotes for JSON-serialised string
command: >-
  python -m main
  --model ${{inputs.model}}
  --data ${{inputs.data}}
  --start_datetime ${{inputs.start_datetime}}
  --end_datetime ${{inputs.end_datetime}}
  --config '${{inputs.config}}'
  --loss ${{outputs.loss}}
  --prediction ${{outputs.prediction}}
  --checkpoint ${{outputs.checkpoint}}

inputs:
  model:
    type: custom_model
    description: Pre-trained Microsoft Aurora model checkpoint to fine-tune.
  data:
    type: uri_folder
    description: Data asset containing the data to fine-tune on.
  start_datetime:
    type: string
    description: >-
      ISO 8601 format start datetime e.g. 2025-01-01T00:00:00. This datetime and that -6
      hours must be present in the data.
  end_datetime:
    type: string
    description: >-
      ISO 8601 format end datetime e.g. 2025-01-31T00:00:00. This datetime is only
      possibly used as a target.
  config:
    type: string
    description: JSON-serialised string of fine-tuning configuration.

outputs:
  loss:
    type: uri_file
    description: >-
      Path to which a NumPy array comprising the loss of each step will be written.
  prediction:
    type: uri_file
    description: >-
      Path to which a NetCDF comprising the forecast generated by the final step will be
      written.
  checkpoint:
    type: uri_file
    description: Path to which a fine-tuned Aurora model checkpoint will be written.

resources:
    instance_count: 1
is_deterministic: true  # whether to re-run the component when inputs are the same
additional_includes:
    - ../common  # include common utils and constants for use in remote code
