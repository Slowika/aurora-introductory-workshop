$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: aurora_inference
display_name: Aurora Inference
version: 1
description: >-
  Command component for performing inference and evaluation with Microsoft Aurora.
tags:
  project: aurora-introductory-workshop

code: .
environment: azureml:aurora_environment@latest
# config arg wrapped in single quotes for JSON-serialised string
command: >-
  python -m main
  --model ${{inputs.model}}
  --data ${{inputs.data}}
  --start_datetime ${{inputs.start_datetime}}
  --config '${{inputs.config}}'
  --predictions ${{outputs.predictions}}

inputs:
  model:
    type: custom_model
    description: Pre-trained Microsoft Aurora model checkpoint to use in inference.
  data:
    type: uri_folder
    description: >-
      Data asset containing the initial state for inference. Ignored if configured mode
      is test.
  start_datetime:
    type: string
    description: >-
      ISO 8601 format start datetime for initial state data e.g. 2025-01-01T00:00:00.
      This datetime and that -6 hours must be present in the data.
  config:
    type: string
    description: JSON-serialised string of inference configuration.

outputs:
  predictions:
    type: uri_file
    description: >-
      Path to which a NetCDF of forecasts generated by each step will be written.

resources:
    instance_count: 1
is_deterministic: true  # whether to re-run the component when inputs are the same
additional_includes:
    - ../common  # include common utils and constants for use in remote code
